name: 🔨 Manual Test Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create Keystore properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Patch App for Testing
        run: |
          # 1. Point the updater at the test channel of the middleman worker
          sed -i 's|pixelmusic-updater.atappu805.workers.dev/updater/check|pixelmusic-updater.atappu805.workers.dev/updater/check?channel=test|g' app/src/main/java/com/saurav/pixelmusic/utils/InAppUpdater.kt

          # 2. Safely change ONLY the main applicationId (will not touch applicationIdSuffix)
          sed -i 's/applicationId = ".*"/applicationId = "com.saurav.pixelmusic.test"/' app/build.gradle.kts
          
          # 3. Change App Name to strictly "Test"
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Test<\/string>/g' app/src/main/res/values/strings.xml

      - name: Calculate Sequential Version
        run: |
          # Fetch the latest release tag from the Test-px repository
          LATEST_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.TEST_REPO_PAT }}" https://api.github.com/repos/Test-px/PixelMusic/releases?per_page=1 | jq -r '.[0].tag_name // empty')
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" == "null" ]; then
            LATEST_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.TEST_REPO_PAT }}" https://api.github.com/repos/Test-px/PixelMusic/releases/latest | jq -r .tag_name)
          fi
          
          # If no releases exist yet, start at 1. Otherwise, extract the number and add 1.
          if [ "$LATEST_TAG" == "null" ] || [ -z "$LATEST_TAG" ]; then
            NEXT_NUM=1
          else
            LAST_NUM=$(echo "$LATEST_TAG" | sed 's/[^0-9]*//g')
            NEXT_NUM=$((LAST_NUM + 1))
          fi
          
          echo "Next version will be test-build-$NEXT_NUM"
          
          # Save the new number to GitHub Environments so the next steps can use it
          echo "NEXT_NUM=$NEXT_NUM" >> $GITHUB_ENV

      - name: Compile Kotlin
        # Compile gate (monitoring cutoff): if this step passes, the code
        # compiles and the heavier build step below needs no watch.
        run: ./gradlew :app:compileReleaseKotlin

      - name: Build Release APK
        # We use env.NEXT_NUM instead of github.run_number
        run: ./gradlew :app:assembleRelease -PAPP_VERSION_NAME="test-build-${{ env.NEXT_NUM }}"

      - name: Upload to Testing Repository
        uses: softprops/action-gh-release@v2
        with:
          repository: Test-px/PixelMusic
          token: ${{ secrets.TEST_REPO_PAT }}
          tag_name: test-build-${{ env.NEXT_NUM }}
          name: Test Build ${{ env.NEXT_NUM }}
          make_latest: true
          body_path: changelog.txt
          files: app/build/outputs/apk/release/*.apk

      - name: 🧹 Clean Up Older Releases (Keep Last 3)
        env:
          GH_TOKEN: ${{ secrets.TEST_REPO_PAT }}
        run: |
          echo "Keeping the last 3 releases and cleaning up older ones..."
          gh release list --repo Test-px/PixelMusic --limit 100 --json tagName -q ".[].tagName" | tail -n +4 | while read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "test-build-${{ env.NEXT_NUM }}" ]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" --repo Test-px/PixelMusic --cleanup-tag -y || true
            fi
          done

      - name: Sync Fork Automatically
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.TEST_REPO_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Test-px/PixelMusic/merge-upstream \
            -d '{"branch":"main"}'

      - name: Send APK and Changelog to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Extract only the first paragraph (latest changes) from changelog.txt
          LATEST_CHANGES=$(awk -v RS='' 'NR==1' changelog.txt)
          
          if [ -z "$LATEST_CHANGES" ]; then
            LATEST_CHANGES="No changelog provided."
          fi
          
          # Build the caption format
          echo "🔨 *Test Build #${{ env.NEXT_NUM }}*" > caption.txt
          echo "" >> caption.txt
          echo "$LATEST_CHANGES" >> caption.txt
          
          CAPTION=$(cat caption.txt)
          
          # Locate all APKs (universal, arm64-v8a, armeabi-v7a)
          APK_COUNT=$(find app/build/outputs/apk/release -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "Error: No APK files found to send."
            exit 1
          fi

          # Send every APK; the caption goes on the first one only
          FIRST=true
          for APK_FILE in app/build/outputs/apk/release/*.apk; do
            echo "Uploading $APK_FILE to Telegram..."

            if [ "$FIRST" = true ]; then
              curl -s -F "chat_id=${CHAT_ID}" \
                   -F "document=@${APK_FILE}" \
                   -F "caption=${CAPTION}" \
                   https://api.telegram.org/bot${BOT_TOKEN}/sendDocument
              FIRST=false
            else
              curl -s -F "chat_id=${CHAT_ID}" \
                   -F "document=@${APK_FILE}" \
                   https://api.telegram.org/bot${BOT_TOKEN}/sendDocument
            fi
          done
