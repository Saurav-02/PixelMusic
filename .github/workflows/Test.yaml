name: 🔨 Manual Test Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Send Workflow Start Notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Send a starting message and save the message ID for live updates
          RESPONSE=$(curl -s -X POST https://api.telegram.org/bot${BOT_TOKEN}/sendMessage \
            -d chat_id=${CHAT_ID} \
            -d text="⏳ *Building new test version...*%0APlease wait while the workflow runs." \
            -d parse_mode=Markdown)
          
          MESSAGE_ID=$(echo $RESPONSE | jq -r '.result.message_id')
          echo "TG_MESSAGE_ID=$MESSAGE_ID" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create Keystore properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Patch App for Testing
        run: |
          # 1. Change the InAppUpdater URL (wildcard catch to prevent mismatch errors)
          sed -i 's|repos/[^/]*/PixelMusic/releases/latest|repos/Test-px/PixelMusic/releases/latest|g' app/src/main/java/com/unshoo/pixelmusic/utils/InAppUpdater.kt

          # 2. Safely change ONLY the main applicationId (will not touch applicationIdSuffix)
          sed -i 's/applicationId = ".*"/applicationId = "com.unshoo.pixelmusic.test"/' app/build.gradle.kts
          
          # 3. Change App Name to strictly "Test"
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Test<\/string>/g' app/src/main/res/values/strings.xml

      - name: Calculate Sequential Version
        run: |
          # Fetch the latest successful release tag from the Test-px repository
          LATEST_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.TEST_REPO_PAT }}" https://api.github.com/repos/Test-px/PixelMusic/releases/latest | jq -r .tag_name)
          
          # If no releases exist yet, start at 1. Otherwise, extract the number and add 1.
          if [ "$LATEST_TAG" == "null" ] || [ -z "$LATEST_TAG" ]; then
            NEXT_NUM=1
          else
            LAST_NUM=$(echo "$LATEST_TAG" | sed 's/[^0-9]*//g')
            NEXT_NUM=$((LAST_NUM + 1))
          fi
          
          echo "Next version will be test-build-$NEXT_NUM"
          
          # Save the new number to GitHub Environments so the next steps can use it
          echo "NEXT_NUM=$NEXT_NUM" >> $GITHUB_ENV

      - name: Build Release APK
        # We use env.NEXT_NUM instead of github.run_number
        run: ./gradlew :app:assembleRelease -PAPP_VERSION_NAME="test-build-${{ env.NEXT_NUM }}"

      - name: Clean Up Old Releases and Tags
        # Use the built-in GitHub CLI (gh) for a much cleaner deletion process
        env:
          GH_TOKEN: ${{ secrets.TEST_REPO_PAT }}
        run: |
          echo "Build succeeded! Wiping old releases and tags to keep the repo clean..."
          
          # 1. Find all releases and forcefully delete them AND their associated tags
          RELEASES=$(gh release list --repo Test-px/PixelMusic --limit 500 --json tagName --jq '.[].tagName')
          for tag in $RELEASES; do
            if [ -n "$tag" ]; then
              echo "Deleting release and tag: $tag"
              gh release delete "$tag" --repo Test-px/PixelMusic --cleanup-tag -y || true
            fi
          done
          
          # 2. Sweep for any leftover dangling tags that didn't have an associated release
          DANGLING_TAGS=$(gh api repos/Test-px/PixelMusic/git/matching-refs/tags/test-build- --jq '.[].ref' 2>/dev/null || echo "")
          for ref in $DANGLING_TAGS; do
            if [ -n "$ref" ]; then
              echo "Deleting dangling ref: $ref"
              gh api -X DELETE repos/Test-px/PixelMusic/git/$ref || true
            fi
          done

      - name: Upload to Testing Repository
        uses: softprops/action-gh-release@v2
        with:
          repository: Test-px/PixelMusic
          token: ${{ secrets.TEST_REPO_PAT }}
          tag_name: test-build-${{ env.NEXT_NUM }}
          name: Test Build ${{ env.NEXT_NUM }}
          body_path: changelog.txt
          files: app/build/outputs/apk/release/*.apk

      - name: Sync Fork Automatically
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.TEST_REPO_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Test-px/PixelMusic/merge-upstream \
            -d '{"branch":"main"}'

      - name: Send APK and Changelog to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Extract only the first paragraph (latest changes) from changelog.txt
          LATEST_CHANGES=$(awk -v RS='' 'NR==1' changelog.txt)
          
          if [ -z "$LATEST_CHANGES" ]; then
            LATEST_CHANGES="No changelog provided."
          fi
          
          # Build the caption format
          echo "🔨 *Test Build #${{ env.NEXT_NUM }}*" > caption.txt
          echo "" >> caption.txt
          echo "$LATEST_CHANGES" >> caption.txt
          
          CAPTION=$(cat caption.txt)
          
          APK_FILE=$(find app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)
          
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found to send."
            exit 1
          fi

          echo "Uploading $APK_FILE to Telegram..."
          
          # Send the APK as a reply to the initial loading message
          curl -s -F "chat_id=${CHAT_ID}" \
               -F "reply_to_message_id=${{ env.TG_MESSAGE_ID }}" \
               -F "document=@${APK_FILE}" \
               -F "caption=${CAPTION}" \
               https://api.telegram.org/bot${BOT_TOKEN}/sendDocument
               
          # Edit the original message to show completion
          curl -s -X POST https://api.telegram.org/bot${BOT_TOKEN}/editMessageText \
            -d chat_id=${CHAT_ID} \
            -d message_id=${{ env.TG_MESSAGE_ID }} \
            -d text="✅ *Build Completed!*%0ATest Build #${{ env.NEXT_NUM }} is ready." \
            -d parse_mode=Markdown
