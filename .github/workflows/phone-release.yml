name: Build All Release Architecture Splits

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build All Release APKs
      # assembleRelease tells Gradle to generate all variant targets configured in your build.gradle
      run: ./gradlew :app:assembleRelease

    - name: Upload Unsigned Split Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PixelMusic-Unsigned-Splits
        # This path dynamically captures every unsigned split (.apk file) generated under outputs
        path: app/build/outputs/apk/release/**/*.apk
        
