name: Gemini CLI
on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  gemini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gemini CLI
        uses: google/gemini-cli-action@v1
        with:
          api_key: ${{ secrets.GEMINI_API_KEY }}
