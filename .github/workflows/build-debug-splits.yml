name: Build All Debug Architecture Splits (Fast Build)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build All Debug APKs
      # assembleDebug skips minification/shrinking for ultra-fast generation of all splits
      run: ./gradlew :app:assembleDebug

    - name: Upload Unsigned Debug Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PixelMusic-Unsigned-DEBUG-Splits
        # Captures every debug APK file generated across the architecture split folders
        path: app/build/outputs/apk/debug/**/*.apk
        
