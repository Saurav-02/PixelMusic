name: Fast Debug Build

on:
  workflow_dispatch: # Allows you to manually trigger a debug build
  push:
    branches: 
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        # Using assembleDebug instead of assembleRelease skips shrinking and signing!
        run: ./gradlew :app:assembleDebug --parallel --build-cache --configuration-cache --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7 # Keep debug builds for 7 days to save GitHub storage space
          
